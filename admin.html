<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 관리자</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero small-hero">
      <div class="badge">관리자</div>
      <h1>관리</h1>
      <p class="subtitle">가입자, 다운로드 기록, 익명 요청함을 확인합니다.</p>
      <div class="actions">
        <a class="btn secondary" href="index.html">홈</a>
        <a class="btn secondary" href="download.html">다운로드</a>
        <button class="btn danger" id="logoutBtn" style="display:none;">로그아웃</button>
      </div>
    </section>

    <section class="card">
      <h2>관리자 상태</h2>
      <p id="adminStatus" class="small">확인 중...</p>
    </section>

    <section class="card" id="usersCard" style="display:none;">
      <h2>사용자 목록</h2>
      <button class="btn secondary" id="refreshUsersBtn">사용자 새로고침</button>
      <div id="usersList" class="list"></div>
    </section>

    <section class="card" id="logsCard" style="display:none;">
      <h2>다운로드 기록</h2>
      <button class="btn secondary" id="refreshLogsBtn">기록 새로고침</button>
      <div id="logsList" class="list"></div>
    </section>

    <section class="card" id="requestsCard" style="display:none;">
      <h2>익명 기능 요청 / 오류 신고</h2>
      <button class="btn secondary" id="refreshRequestsBtn">요청 새로고침</button>
      <div id="requestsList" class="list"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, getDocs, collection, updateDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value) {
      if (!value) return "-";
      try {
        const d = value.toDate ? value.toDate() : new Date(value);
        return d.toLocaleString("ko-KR");
      } catch (e) {
        return "-";
      }
    }

    function showError(targetId, message) {
      $(targetId).innerHTML = `<p class="small">불러오기 실패: ${escapeHtml(message)}</p>`;
    }

    async function loadUsers() {
      const list = $("usersList");
      list.innerHTML = "<p class='small'>불러오는 중...</p>";
      try {
        const snap = await getDocs(collection(db, "users"));
        const users = [];
        snap.forEach(docSnap => users.push({ id: docSnap.id, ...docSnap.data() }));
        users.sort((a, b) => (a.email || "").localeCompare(b.email || ""));
        if (users.length === 0) {
          list.innerHTML = "<p class='small'>사용자가 없습니다.</p>";
          return;
        }
        list.innerHTML = "";
        users.forEach(user => {
          const row = document.createElement("div");
          row.className = "item";
          const blocked = user.blocked === true;
          row.innerHTML = `
            <div>
              <b>${escapeHtml(user.name || "-")}</b>
              <div class="meta">${escapeHtml(user.department || "-")} · ${escapeHtml(user.email || "-")} · ${escapeHtml(user.role || "user")}</div>
              <div class="meta">${blocked ? "차단됨" : "사용 가능"}</div>
            </div>
          `;
          const btn = document.createElement("button");
          btn.className = blocked ? "btn secondary mini" : "btn danger mini";
          btn.textContent = blocked ? "차단해제" : "차단";
          btn.addEventListener("click", async () => {
            await updateDoc(doc(db, "users", user.id), { blocked: !blocked, updatedAt: serverTimestamp() });
            await loadUsers();
          });
          row.appendChild(btn);
          list.appendChild(row);
        });
      } catch (e) {
        showError("usersList", e.message);
      }
    }

    async function loadLogs() {
      const list = $("logsList");
      list.innerHTML = "<p class='small'>불러오는 중...</p>";
      try {
        const snap = await getDocs(collection(db, "downloadLogs"));
        const logs = [];
        snap.forEach(docSnap => logs.push({ id: docSnap.id, ...docSnap.data() }));
        logs.sort((a, b) => {
          const at = a.downloadedAt && a.downloadedAt.toMillis ? a.downloadedAt.toMillis() : 0;
          const bt = b.downloadedAt && b.downloadedAt.toMillis ? b.downloadedAt.toMillis() : 0;
          return bt - at;
        });
        if (logs.length === 0) {
          list.innerHTML = "<p class='small'>다운로드 기록이 없습니다.</p>";
          return;
        }
        list.innerHTML = "";
        logs.forEach(log => {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div>
              <b>${escapeHtml(log.name || "-")} / ${escapeHtml(log.department || "-")}</b>
              <div class="meta">${escapeHtml(log.email || "-")} · ${escapeHtml(log.versionName || "-")} (${escapeHtml(log.versionCode || "-")})</div>
              <div class="meta">${formatTime(log.downloadedAt)}</div>
            </div>
          `;
          list.appendChild(row);
        });
      } catch (e) {
        showError("logsList", e.message);
      }
    }

    async function loadRequests() {
      const list = $("requestsList");
      list.innerHTML = "<p class='small'>불러오는 중...</p>";
      try {
        const snap = await getDocs(collection(db, "requests"));
        const requests = [];
        snap.forEach(docSnap => requests.push({ id: docSnap.id, ...docSnap.data() }));
        requests.sort((a, b) => {
          const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
          const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
          return bt - at;
        });
        if (requests.length === 0) {
          list.innerHTML = "<p class='small'>등록된 요청이 없습니다.</p>";
          return;
        }
        const statuses = ["접수", "검토중", "적용완료", "보류", "거절"];
        list.innerHTML = "";
        requests.forEach(req => {
          const row = document.createElement("div");
          row.className = "item vertical";
          row.innerHTML = `
            <div class="item-head">
              <b>${escapeHtml(req.title || "-")}</b>
              <span class="status">${escapeHtml(req.status || "접수")}</span>
            </div>
            <div class="meta">${escapeHtml(req.category || "-")} · 익명 요청 · ${formatTime(req.createdAt)}</div>
            <div class="request-content">${escapeHtml(req.content || "")}</div>
          `;
          const control = document.createElement("div");
          control.className = "actions left no-top";
          statuses.forEach(status => {
            const btn = document.createElement("button");
            btn.className = status === (req.status || "접수") ? "btn primary mini" : "btn secondary mini";
            btn.textContent = status;
            btn.addEventListener("click", async () => {
              await updateDoc(doc(db, "requests", req.id), {
                status,
                updatedAt: serverTimestamp()
              });
              await loadRequests();
            });
            control.appendChild(btn);
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "btn danger mini";
          deleteBtn.textContent = "삭제";
          deleteBtn.addEventListener("click", async () => {
            if (!confirm("이 요청을 삭제할까요? 삭제하면 다시 복구할 수 없습니다.")) return;
            await deleteDoc(doc(db, "requests", req.id));
            await loadRequests();
          });
          control.appendChild(deleteBtn);

          row.appendChild(control);
          list.appendChild(row);
        });
      } catch (e) {
        showError("requestsList", e.message);
      }
    }

    async function loadAll() {
      await Promise.allSettled([loadUsers(), loadLogs(), loadRequests()]);
    }

    $("refreshUsersBtn").addEventListener("click", loadUsers);
    $("refreshLogsBtn").addEventListener("click", loadLogs);
    $("refreshRequestsBtn").addEventListener("click", loadRequests);
    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "login.html";
    });

    onAuthStateChanged(auth, async user => {
      if (!user) {
        $("adminStatus").innerHTML = "로그인이 필요합니다. <a href='login.html'>로그인</a>";
        return;
      }

      $("logoutBtn").style.display = "inline-flex";

      let profile = {};
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        profile = snap.exists() ? snap.data() : {};
      } catch (e) {
        profile = {};
      }

      const isAdmin = user.email === ADMIN_EMAIL || profile.role === "admin";
      if (!isAdmin) {
        $("adminStatus").textContent = "관리자 권한이 없습니다.";
        return;
      }

      $("adminStatus").textContent = `${user.email} 관리자 로그인됨`;
      $("usersCard").style.display = "block";
      $("logsCard").style.display = "block";
      $("requestsCard").style.display = "block";
      await loadAll();
    });
  </script>
</body>
</html>
