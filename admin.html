<!doctype html>
<!-- HWAITING ADMIN DOWNLOAD TIME FIX v113 -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 관리자</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-grid { display:grid; gap:10px; }
    .user-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; }
    .user-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .email-line { overflow-wrap:anywhere; }
    .log-group { border:1px solid #e1d3bf; border-radius:16px; background:#f4ead9; overflow:hidden; }
    .log-group summary { padding:12px; cursor:pointer; font-weight:900; }
    .log-body { padding:0 12px 12px; display:grid; gap:8px; }
    .inline-select { width:auto; min-width:120px; min-height:36px; padding:7px 10px; }
    @media (max-width:620px) {
      .user-row { grid-template-columns:1fr; }
      .user-actions { justify-content:flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero small-hero">
      <div class="badge">관리자</div>
      <h1>관리</h1>
      <p class="subtitle">가입자, 다운로드 기록, 익명 요청함을 확인합니다.</p>
      <div class="actions">
        <a class="btn secondary" href="index.html">홈</a>
        <a class="btn secondary" href="download.html">다운로드</a>
        <button class="btn danger" id="logoutBtn" style="display:none;">로그아웃</button>
      </div>
    </section>

    <section class="card">
      <h2>관리자 상태</h2>
      <p id="adminStatus" class="small">확인 중...</p>
    </section>

    <section class="card" id="usersCard" style="display:none;">
      <h2>사용자 목록</h2>
      <div class="actions left no-top">
        <button class="btn secondary mini" id="refreshUsersBtn">사용자 새로고침</button>
      </div>
      <div id="usersList" class="list admin-grid"></div>
    </section>

    <section class="card" id="logsCard" style="display:none;">
      <h2>다운로드 기록</h2>
      <div class="actions left no-top" style="gap:8px; flex-wrap:wrap;">
        <button class="btn secondary mini" id="refreshLogsBtn">기록 새로고침</button>
        <button class="btn secondary mini" id="collapseLogsBtn">이름별 접기</button>
        <button class="btn secondary mini" id="expandLogsBtn">전체 펼치기</button>
        <button class="btn danger mini" id="deleteAllLogsBtn">전체 기록 삭제</button>
      </div>
      <div id="logsList" class="list"></div>
    </section>

    <section class="card" id="requestsCard" style="display:none;">
      <h2>익명 기능 요청 / 오류 신고</h2>
      <button class="btn secondary" id="refreshRequestsBtn">요청 새로고침</button>
      <div id="requestsList" class="list"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, getDocs, collection, setDoc, updateDoc,
      deleteDoc, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    auth.languageCode = "ko";

    const $ = id => document.getElementById(id);
    let currentAdmin = null;
    let logDetails = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function stamp(value) {
      try {
        if (!value) return "시간 없음";
        let date;
        if (typeof value.toDate === "function") {
          date = value.toDate();
        } else if (typeof value.seconds === "number" || typeof value._seconds === "number") {
          const seconds = typeof value.seconds === "number" ? value.seconds : value._seconds;
          const nanos = typeof value.nanoseconds === "number" ? value.nanoseconds : (value._nanoseconds || 0);
          date = new Date(seconds * 1000 + Math.floor(nanos / 1000000));
        } else if (typeof value === "number") {
          date = new Date(value < 1000000000000 ? value * 1000 : value);
        } else {
          date = new Date(value);
        }
        if (Number.isNaN(date.getTime())) return "시간 없음";
        return new Intl.DateTimeFormat("ko-KR", {
          year:"numeric", month:"2-digit", day:"2-digit",
          hour:"2-digit", minute:"2-digit", second:"2-digit",
          hour12:true
        }).format(date);
      } catch (_) {
        return "시간 없음";
      }
    }

    function downloadTime(log) {
      if (!log) return null;
      return log.downloadedAt || log.createdAt || log.timestamp || log.time || log.updatedAt
        || log.downloadedAtMs || log.clientTime || log.downloadTime || null;
    }

    function timeMillis(value) {
      try {
        if (!value) return 0;
        if (typeof value.toMillis === "function") return value.toMillis();
        if (typeof value.toDate === "function") return value.toDate().getTime();
        if (typeof value.seconds === "number" || typeof value._seconds === "number") {
          const seconds = typeof value.seconds === "number" ? value.seconds : value._seconds;
          const nanos = typeof value.nanoseconds === "number" ? value.nanoseconds : (value._nanoseconds || 0);
          return seconds * 1000 + Math.floor(nanos / 1000000);
        }
        if (typeof value === "number") return value < 1000000000000 ? value * 1000 : value;
        const parsed = new Date(value).getTime();
        return Number.isNaN(parsed) ? 0 : parsed;
      } catch (_) {
        return 0;
      }
    }

    function setAdminUi(enabled) {
      ["usersCard", "logsCard", "requestsCard"].forEach(id => $(id).style.display = enabled ? "block" : "none");
      $("logoutBtn").style.display = enabled ? "inline-flex" : "none";
    }

    async function isAdmin(user) {
      if (!user) return false;
      if ((user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) return true;
      const snap = await getDoc(doc(db, "users", user.uid));
      return snap.exists() && snap.data().role === "admin";
    }

    async function ensureAdminProfile(user) {
      if (!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) return;
      await user.getIdToken(true);
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        email: (user.email || ADMIN_EMAIL).toLowerCase(),
        role: "admin",
        approved: true,
        blocked: false,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    function button(text, className, handler) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = className;
      el.textContent = text;
      el.onclick = handler;
      return el;
    }

    async function loadUsers() {
      $("usersList").innerHTML = '<p class="small">불러오는 중...</p>';
      try {
        const snap = await getDocs(collection(db, "users"));
        const users = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        users.sort((a,b) => String(a.name || a.email || "").localeCompare(String(b.name || b.email || ""), "ko"));
        $("usersList").innerHTML = "";
        if (!users.length) {
          $("usersList").innerHTML = '<p class="small">등록된 사용자가 없습니다.</p>';
          return;
        }

        users.forEach(user => {
          const item = document.createElement("div");
          item.className = "item user-row";
          const info = document.createElement("div");
          info.innerHTML = `
            <div><b>${escapeHtml(user.name || "이름 없음")}</b> <span class="status">${escapeHtml(user.department || "부서 없음")}</span></div>
            <div class="meta email-line">${escapeHtml(user.email || "이메일 없음")}</div>
            <div class="meta">UID: ${escapeHtml(user.id)} · ${user.blocked === true ? "차단됨" : "정상"} · ${escapeHtml(user.role || "user")}</div>
          `;

          const actions = document.createElement("div");
          actions.className = "user-actions";
          actions.appendChild(button(user.blocked === true ? "차단 해제" : "차단", "btn secondary mini", async () => {
            try {
              await updateDoc(doc(db, "users", user.id), { blocked: user.blocked !== true, updatedAt:serverTimestamp() });
              await loadUsers();
            } catch (error) {
              alert("차단 상태를 변경하지 못했습니다.");
            }
          }));

          actions.appendChild(button("비밀번호 메일", "btn secondary mini", async () => {
            if (!user.email) return alert("이메일 정보가 없습니다.");
            if (!confirm(`${user.email} 주소로 비밀번호 재설정 메일을 보낼까요?`)) return;
            try {
              await sendPasswordResetEmail(auth, user.email);
              alert("비밀번호 재설정 메일을 보냈습니다.");
            } catch (error) {
              alert("메일을 보내지 못했습니다. Firebase Authentication 설정을 확인해 주세요.");
            }
          }));

          item.append(info, actions);
          $("usersList").appendChild(item);
        });
      } catch (error) {
        console.error(error);
        const denied = error?.code === "permission-denied";
        $("usersList").innerHTML = `<p class="small">${denied ? "관리자 권한 규칙을 확인하지 못했습니다. Firestore Rules를 최종본으로 게시한 뒤 다시 눌러주세요." : "사용자 목록을 불러오지 못했습니다."}</p>`;
      }
    }

    async function deleteDocsInBatches(docs) {
      for (let start = 0; start < docs.length; start += 400) {
        const batch = writeBatch(db);
        docs.slice(start, start + 400).forEach(item => batch.delete(item.ref));
        await batch.commit();
      }
    }

    async function loadLogs() {
      $("logsList").innerHTML = '<p class="small">불러오는 중...</p>';
      try {
        const snap = await getDocs(collection(db, "downloadLogs"));
        const logs = snap.docs.map(d => ({ id:d.id, ref:d.ref, ...d.data() }));
        logs.sort((a,b) => timeMillis(downloadTime(b)) - timeMillis(downloadTime(a)));
        const groups = new Map();
        logs.forEach(log => {
          const key = log.email || log.uid || log.name || "알 수 없음";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(log);
        });
        $("logsList").innerHTML = "";
        logDetails = [];
        if (!logs.length) {
          $("logsList").innerHTML = '<p class="small">다운로드 기록이 없습니다.</p>';
          return;
        }

        groups.forEach((items, key) => {
          const detail = document.createElement("details");
          detail.className = "log-group";
          detail.open = false;
          logDetails.push(detail);
          const summary = document.createElement("summary");
          const first = items[0];
          summary.textContent = `${first.name || "이름 없음"} · ${first.email || key} · ${items.length}건`;
          detail.appendChild(summary);
          const body = document.createElement("div");
          body.className = "log-body";

          const deleteGroup = button("이 사용자의 기록 삭제", "btn danger mini", async event => {
            event.preventDefault();
            if (!confirm(`${first.name || first.email || key}의 다운로드 기록 ${items.length}건을 삭제할까요?`)) return;
            await deleteDocsInBatches(items);
            await loadLogs();
          });
          body.appendChild(deleteGroup);

          items.forEach(log => {
            const row = document.createElement("div");
            row.className = "item";
            const info = document.createElement("div");
            info.innerHTML = `<b>${escapeHtml(log.fileName || log.apkFile || log.versionName || "APK 다운로드")}</b><div class="meta">다운로드 시간: ${stamp(downloadTime(log))}${log.department ? ` · ${escapeHtml(log.department)}` : ""}</div>`;
            const del = button("삭제", "btn secondary mini", async () => {
              if (!confirm("이 기록을 삭제할까요?")) return;
              await deleteDoc(log.ref);
              await loadLogs();
            });
            row.append(info, del);
            body.appendChild(row);
          });
          detail.appendChild(body);
          $("logsList").appendChild(detail);
        });
      } catch (error) {
        console.error(error);
        $("logsList").innerHTML = '<p class="small">다운로드 기록을 불러오지 못했습니다.</p>';
      }
    }

    async function loadRequests() {
      $("requestsList").innerHTML = '<p class="small">불러오는 중...</p>';
      try {
        const snap = await getDocs(collection(db, "requests"));
        const requests = snap.docs.map(d => ({ id:d.id, ref:d.ref, ...d.data() }));
        requests.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        $("requestsList").innerHTML = "";
        if (!requests.length) {
          $("requestsList").innerHTML = '<p class="small">등록된 요청이 없습니다.</p>';
          return;
        }
        const statuses = ["접수", "검토중", "적용완료", "보류", "거절"];
        requests.forEach(request => {
          const item = document.createElement("div");
          item.className = "item vertical";
          const head = document.createElement("div");
          head.className = "item-head";
          head.innerHTML = `<div><b>${escapeHtml(request.title || "제목 없음")}</b><div class="meta">${escapeHtml(request.category || "기타")} · ${stamp(request.createdAt)} · 익명</div></div>`;
          const status = document.createElement("span");
          status.className = "status";
          status.textContent = request.status || "접수";
          head.appendChild(status);
          const content = document.createElement("div");
          content.className = "request-content";
          content.textContent = request.content || "";
          const actions = document.createElement("div");
          actions.className = "actions left no-top";
          const select = document.createElement("select");
          select.className = "inline-select";
          statuses.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            option.selected = value === (request.status || "접수");
            select.appendChild(option);
          });
          actions.appendChild(select);
          actions.appendChild(button("상태 저장", "btn secondary mini", async () => {
            await updateDoc(request.ref, { status:select.value, updatedAt:serverTimestamp() });
            await loadRequests();
          }));
          actions.appendChild(button("요청 삭제", "btn danger mini", async () => {
            if (!confirm("이 요청을 삭제할까요?")) return;
            await deleteDoc(request.ref);
            await loadRequests();
          }));
          item.append(head, content, actions);
          $("requestsList").appendChild(item);
        });
      } catch (error) {
        console.error(error);
        $("requestsList").innerHTML = '<p class="small">요청 목록을 불러오지 못했습니다.</p>';
      }
    }

    $("refreshUsersBtn").onclick = loadUsers;
    $("refreshLogsBtn").onclick = loadLogs;
    $("refreshRequestsBtn").onclick = loadRequests;
    $("collapseLogsBtn").onclick = () => logDetails.forEach(detail => detail.open = false);
    $("expandLogsBtn").onclick = () => logDetails.forEach(detail => detail.open = true);
    $("deleteAllLogsBtn").onclick = async () => {
      if (!confirm("모든 다운로드 기록을 삭제할까요?")) return;
      const snap = await getDocs(collection(db, "downloadLogs"));
      await deleteDocsInBatches(snap.docs);
      await loadLogs();
    };
    $("logoutBtn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, async user => {
      currentAdmin = user;
      if (!user) {
        setAdminUi(false);
        $("adminStatus").innerHTML = '관리자 로그인이 필요합니다. <a href="login.html">로그인하기</a>';
        return;
      }
      try {
        if (!(await isAdmin(user))) {
          setAdminUi(false);
          $("adminStatus").textContent = "관리자 계정이 아닙니다.";
          return;
        }
        await ensureAdminProfile(user);
        setAdminUi(true);
        $("adminStatus").textContent = `${user.email} 관리자 로그인 완료`;
        await Promise.all([loadUsers(), loadLogs(), loadRequests()]);
      } catch (error) {
        console.error(error);
        setAdminUi(false);
        $("adminStatus").textContent = "관리자 권한을 확인하지 못했습니다.";
      }
    });
  </script>
</body>
</html>
