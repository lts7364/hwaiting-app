<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 교대근무 앱</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    .home-actions .btn{width:100%;min-height:54px}
    .home-note{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.6}
    .mini-links{margin-top:12px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px}
    .mini-links a{color:var(--green);font-weight:900;text-decoration:none}
    @media(max-width:620px){.home-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page narrow">
    <section class="hero">
      <div class="badge">Android 교대근무 달력</div>
      <h1>화이팅</h1>
      <p class="subtitle">로그인하고 최신 앱을 간단하게 다운로드하세요.</p>

      <div class="home-actions">
        <a class="btn primary" href="login.html">로그인</a>
        <a class="btn secondary" href="login.html?mode=signup">회원가입</a>
        <a class="btn secondary" href="login.html?mode=legacy">기존 사용자 전환</a>
        <a class="btn secondary" href="download.html">앱 다운로드</a>
      </div>

      <p class="home-note">새 회원은 아이디·이름·소속·비밀번호만 입력합니다.<br>예전 이메일 가입자는 기존 계정을 그대로 쓰거나 새 아이디로 전환할 수 있습니다.</p>

      <div class="mini-links">
        <a href="guide.html">사용설명서</a>
        <a href="request.html">기능 요청 / 오류 신고</a>
      </div>
    </section>

    <section class="card version-card">
      <h2>최신 버전</h2>
      <div class="version-grid">
        <div><span class="label">버전명</span><strong id="versionName">불러오는 중...</strong></div>
        <div><span class="label">버전코드</span><strong id="versionCode">-</strong></div>
        <div><span class="label">업데이트</span><strong id="updatedAt">-</strong></div>
      </div>
    </section>

    <section class="card notice-card">
      <h2>안내</h2>
      <p>화이팅은 개인 편의를 위해 제작한 비공식 앱입니다.</p>
      <p>근무 정보는 참고용이며 실제 근무표와 공식 공지를 우선 확인해 주세요.</p>
    </section>

    <footer><p>화이팅 앱 배포 페이지</p></footer>
  </main>

  <script>
    async function loadVersion() {
      try {
        const response = await fetch("version.json", { cache: "no-store" });
        const data = await response.json();
        document.getElementById("versionName").textContent = data.versionName || "-";
        document.getElementById("versionCode").textContent = data.versionCode ?? "-";
        document.getElementById("updatedAt").textContent = data.updatedAt || "-";
      } catch (_) {
        document.getElementById("versionName").textContent = "확인 실패";
      }
    }
    loadVersion();
  </script>
</body>
</html>
