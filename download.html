<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 다운로드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page narrow">
    <section class="hero small-hero">
      <div class="badge">APK 다운로드</div>
      <h1>다운로드</h1>
      <p class="subtitle">로그인 후 화이팅 앱을 다운로드할 수 있습니다.</p>
    </section>

    <section class="card notice-card">
      <h2>다운로드 전 안내</h2>
      <p>이 앱은 개인 편의를 위한 비공식 앱이며, 회사 또는 특정 기관의 공식 앱이 아닙니다.</p>
      <p>근무 정보는 참고용이므로 실제 근무표와 공식 공지를 우선 확인해 주세요.</p>
      <p>무단 재배포는 권장하지 않습니다.</p>
    </section>

    <section class="card done-card">
      <h2 id="downloadTitle" class="download-title">확인 중...</h2>
      <p id="userInfo" class="small">로그인 상태를 확인하고 있습니다.</p>
      <p id="downloadStatus" class="small top-gap"></p>
      <div class="actions">
        <button class="btn primary" id="downloadBtn" style="display:none;">APK 다운로드</button>
        <a class="btn primary" id="loginLink" href="login.html" style="display:none;">로그인 / 회원가입</a>
      </div>
      <div class="text-links" id="subLinks" style="display:none;">
        <a href="request.html">요청함에 남기기</a>
        <button id="logoutBtn" type="button">로그아웃</button>
      </div>
    </section>

    <section class="card">
      <h2>설치 안내</h2>
      <p class="small">APK 설치 시 휴대폰 설정에서 “알 수 없는 앱 설치 허용”이 필요할 수 있습니다.</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, ADMIN_EMAIL, APP_VERSION, APK_FILE } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentProfile = null;
    let downloadInProgress = false;
    let cooldownTimer = null;
    const DOWNLOAD_COOLDOWN_MS = 2 * 60 * 1000;

    function downloadLockKey() {
      if (!currentUser) return null;
      return `hwaitingDownloadCooldown:${currentUser.uid}:${APP_VERSION.versionCode}`;
    }

    function getCooldownRemainingMs() {
      const key = downloadLockKey();
      if (!key) return 0;
      const until = Number(localStorage.getItem(key) || 0);
      return Math.max(0, until - Date.now());
    }

    function setDownloadCooldown() {
      const key = downloadLockKey();
      if (!key) return;
      localStorage.setItem(key, String(Date.now() + DOWNLOAD_COOLDOWN_MS));
    }

    function clearCooldownTimer() {
      if (cooldownTimer) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
      }
    }

    function updateDownloadButtonState() {
      const btn = $("downloadBtn");
      if (!btn || btn.style.display === "none") return;
      const remaining = getCooldownRemainingMs();
      if (downloadInProgress) {
        btn.disabled = true;
        btn.textContent = "다운로드 준비 중...";
        return;
      }
      if (remaining > 0) {
        const seconds = Math.ceil(remaining / 1000);
        btn.disabled = true;
        btn.textContent = `${seconds}초 후 다시 가능`;
        $("downloadStatus").textContent = "중복 다운로드 방지를 위해 2분 후 다시 다운로드할 수 있습니다.";
        return;
      }
      btn.disabled = false;
      btn.textContent = "APK 다운로드";
      $("downloadStatus").textContent = `최신 버전 ${APP_VERSION.versionName}`;
    }

    function startCooldownWatcher() {
      clearCooldownTimer();
      updateDownloadButtonState();
      cooldownTimer = setInterval(() => {
        updateDownloadButtonState();
        if (!downloadInProgress && getCooldownRemainingMs() <= 0) {
          clearCooldownTimer();
        }
      }, 1000);
    }

    async function ensureProfile(user) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()) return snap.data();

      const role = user.email === ADMIN_EMAIL ? "admin" : "user";
      const data = {
        uid: user.uid,
        email: user.email,
        name: user.displayName || user.email.split("@")[0],
        department: "",
        approved: true,
        blocked: false,
        role,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
      await setDoc(ref, data, { merge: true });
      return data;
    }

    onAuthStateChanged(auth, async user => {
      currentUser = user;
      clearCooldownTimer();
      downloadInProgress = false;

      if (!user) {
        $("downloadTitle").textContent = "로그인이 필요합니다";
        $("userInfo").textContent = "앱을 받으려면 먼저 로그인하거나 회원가입해 주세요.";
        $("loginLink").style.display = "inline-flex";
        $("downloadBtn").style.display = "none";
        $("subLinks").style.display = "none";
        return;
      }

      try {
        currentProfile = await ensureProfile(user);
        $("subLinks").style.display = "flex";
        $("loginLink").style.display = "none";

        if (currentProfile.blocked === true) {
          $("downloadTitle").textContent = "다운로드 불가";
          $("userInfo").textContent = "이 계정은 다운로드가 차단되었습니다.";
          $("downloadBtn").style.display = "none";
          return;
        }

        $("downloadTitle").textContent = "다운로드 준비 완료";
        $("userInfo").textContent = `${currentProfile.name || "사용자"}님, 화이팅 앱을 다운로드할 수 있습니다.`;
        $("downloadBtn").style.display = "inline-flex";
        startCooldownWatcher();
      } catch (e) {
        $("downloadTitle").textContent = "확인 실패";
        $("userInfo").textContent = "사용자 정보를 불러오지 못했습니다.";
        $("downloadStatus").textContent = e.message;
      }
    });

    $("downloadBtn").addEventListener("click", async () => {
      if (!currentUser || !currentProfile) {
        location.href = "login.html";
        return;
      }
      if (currentProfile.blocked === true) {
        alert("다운로드가 차단된 계정입니다.");
        return;
      }
      if (downloadInProgress || getCooldownRemainingMs() > 0) {
        updateDownloadButtonState();
        return;
      }

      downloadInProgress = true;
      setDownloadCooldown();
      updateDownloadButtonState();

      try {
        $("downloadStatus").textContent = "다운로드 준비 중입니다. 잠시만 기다려 주세요.";
        await addDoc(collection(db, "downloadLogs"), {
          uid: currentUser.uid,
          email: currentUser.email,
          name: currentProfile.name || "",
          department: currentProfile.department || "",
          versionName: APP_VERSION.versionName,
          versionCode: APP_VERSION.versionCode,
          apkFile: APK_FILE,
          status: "success",
          downloadedAt: serverTimestamp(),
          userAgent: navigator.userAgent
        });

        $("downloadStatus").textContent = "APK 다운로드를 시작합니다. 중복 다운로드 방지를 위해 2분 후 다시 받을 수 있습니다.";
        startCooldownWatcher();
        setTimeout(() => {
          downloadInProgress = false;
          updateDownloadButtonState();
        }, 2500);
        window.location.href = APK_FILE;
      } catch (e) {
        const key = downloadLockKey();
        if (key) localStorage.removeItem(key);
        downloadInProgress = false;
        updateDownloadButtonState();
        alert("다운로드 실패: " + e.message);
        $("downloadStatus").textContent = "다운로드 실패";
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "login.html";
    });
  </script>
</body>
</html>
