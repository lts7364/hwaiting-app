<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 익명 요청함</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .public-badge { background:#fff0d7; color:#8a5a15; }
    .request-result { min-height:24px; margin:8px 0 0; font-size:13px; line-height:1.5; }
    .request-result.ok { color:var(--green); font-weight:900; }
    .request-result.error { color:var(--danger); font-weight:900; }
    .honeypot { position:absolute !important; left:-99999px !important; width:1px !important; height:1px !important; opacity:0 !important; pointer-events:none !important; }
  </style>
</head>
<body>
  <main class="page narrow">
    <section class="hero small-hero">
      <div class="badge public-badge">로그인 없이 작성</div>
      <h1>요청함</h1>
      <p class="subtitle">로그인하지 않아도 기능 요청이나 오류 내용을 익명으로 남길 수 있습니다.</p>
      <div class="text-links">
        <a href="index.html">홈</a>
        <a href="download.html">다운로드</a>
        <a href="guide.html">사용설명서</a>
      </div>
    </section>

    <section class="card notice-card">
      <h2>안내</h2>
      <p>이름·부서·이메일은 수집하지 않습니다.</p>
      <p>내용 확인이 가능하도록 오류 상황과 원하는 기능을 자세히 적어주세요.</p>
    </section>

    <section class="card" id="requestFormCard">
      <h2>익명 요청 작성</h2>
      <form class="form" id="requestForm">
        <select id="category" required>
          <option value="기능 추가">기능 추가</option>
          <option value="오류 신고">오류 신고</option>
          <option value="사용법 질문">사용법 질문</option>
          <option value="기타">기타</option>
        </select>
        <input id="title" type="text" maxlength="80" placeholder="제목" required />
        <textarea id="content" maxlength="2000" placeholder="내용을 자세히 입력해 주세요." required></textarea>
        <input class="honeypot" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button class="btn primary full" id="submitBtn" type="submit">익명 요청 등록</button>
        <p class="request-result" id="resultMessage"></p>
      </form>
    </section>

    <section class="card">
      <h2>처리 상태</h2>
      <p class="small">로그인 없이 작성한 익명 요청은 작성자 확인 정보가 없으므로 이 화면에서 개별 처리 상태를 조회할 수 없습니다. 관리자가 요청 내용을 확인해 앱 업데이트에 반영합니다.</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);
    const LAST_SUBMIT_KEY = "hwaiting_public_request_last_submit";

    function setResult(text, type = "") {
      const el = $("resultMessage");
      el.textContent = text || "";
      el.className = "request-result" + (type ? ` ${type}` : "");
    }

    $("requestForm").addEventListener("submit", async event => {
      event.preventDefault();
      if ($("website").value) return;

      const now = Date.now();
      const previous = Number(localStorage.getItem(LAST_SUBMIT_KEY) || 0);
      if (now - previous < 20000) {
        setResult("연속 등록은 20초 후에 가능합니다.", "error");
        return;
      }

      const category = $("category").value;
      const title = $("title").value.trim();
      const content = $("content").value.trim();
      if (title.length < 2 || content.length < 2) {
        setResult("제목과 내용을 조금 더 자세히 입력해 주세요.", "error");
        return;
      }

      $("submitBtn").disabled = true;
      setResult("등록 중...");
      try {
        await addDoc(collection(db, "requests"), {
          anonymous: true,
          category,
          title,
          content,
          status: "접수",
          source: "public-web",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        localStorage.setItem(LAST_SUBMIT_KEY, String(Date.now()));
        $("requestForm").reset();
        setResult("익명 요청이 등록되었습니다.", "ok");
      } catch (error) {
        console.error(error);
        setResult("등록하지 못했습니다. Firestore 규칙 적용 여부와 인터넷 연결을 확인해 주세요.", "error");
      } finally {
        $("submitBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
