<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 익명 요청함</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero small-hero">
      <div class="badge">가입자 익명 요청함</div>
      <h1>익명 요청함</h1>
      <p class="subtitle">
        로그인한 사람만 작성할 수 있지만, 관리자 화면에는 작성자 정보가 표시되지 않습니다.
      </p>
      <div class="actions">
        <a class="btn secondary" href="index.html">홈</a>
        <a class="btn secondary" href="download.html">다운로드</a>
        <a class="btn secondary" href="login.html" id="loginTopLink">로그인</a>
        <button class="btn danger" id="logoutBtn" style="display:none;">로그아웃</button>
      </div>
    </section>

    <section class="card notice-card">
      <h2>안내</h2>
      <p>
        요청은 익명으로 접수됩니다. 관리자 화면에는 이름, 부서, 이메일이 표시되지 않습니다.
      </p>
      <p>
        다만 장난글 방지를 위해 로그인한 사용자만 작성할 수 있고, 본인은 아래에서 자기 요청 상태를 확인할 수 있습니다.
      </p>
    </section>

    <section class="card">
      <h2>로그인 상태</h2>
      <p id="userInfo" class="small">확인 중...</p>
    </section>

    <section class="card" id="requestFormCard" style="display:none;">
      <h2>요청 작성</h2>
      <div class="form">
        <select id="category">
          <option value="기능 추가">기능 추가</option>
          <option value="오류 신고">오류 신고</option>
          <option value="사용법 질문">사용법 질문</option>
          <option value="기타">기타</option>
        </select>
        <input id="title" placeholder="제목 예: 위젯 글씨 크게 해주세요" />
        <textarea id="content" placeholder="내용을 편하게 적어주세요. 예: 어떤 화면에서, 어떤 상황에서, 어떻게 바꾸고 싶은지"></textarea>
        <button class="btn primary full" id="submitBtn">익명 요청 등록</button>
      </div>
      <p class="small top-gap">관리자에게는 익명으로 보이고, 내 요청 목록에서는 상태를 확인할 수 있습니다.</p>
    </section>

    <section class="card">
      <h2>내 요청 상태</h2>
      <div id="myRequests" class="list">
        <p class="small">로그인 후 확인할 수 있습니다.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, addDoc, collection, serverTimestamp,
      getDocs, query, where
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentProfile = null;

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value) {
      if (!value) return "-";
      try {
        const d = value.toDate ? value.toDate() : new Date(value);
        return d.toLocaleString("ko-KR");
      } catch (e) {
        return "-";
      }
    }

    function statusClass(status) {
      if (status === "적용완료") return "status done";
      if (status === "검토중") return "status progress";
      if (status === "보류" || status === "거절") return "status hold";
      return "status";
    }

    async function loadMyRequests() {
      const box = $("myRequests");
      if (!currentUser) {
        box.innerHTML = "<p class='small'>로그인 후 내가 작성한 요청 상태를 확인할 수 있습니다.</p>";
        return;
      }

      try {
        const q = query(collection(db, "requests"), where("uid", "==", currentUser.uid));
        const snap = await getDocs(q);
        const rows = [];
        snap.forEach(docSnap => rows.push({ id: docSnap.id, ...docSnap.data() }));
        rows.sort((a, b) => {
          const at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
          const bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
          return bt - at;
        });

        if (rows.length === 0) {
          box.innerHTML = "<p class='small'>아직 작성한 요청이 없습니다.</p>";
          return;
        }

        box.innerHTML = "";
        rows.forEach(req => {
          const item = document.createElement("div");
          item.className = "item vertical";
          item.innerHTML = `
            <div class="item-head">
              <b>${escapeHtml(req.title || "-")}</b>
              <span class="${statusClass(req.status || "접수")}">${escapeHtml(req.status || "접수")}</span>
            </div>
            <div class="meta">${escapeHtml(req.category || "-")} · ${formatTime(req.createdAt)}</div>
            <div class="request-content">${escapeHtml(req.content || "")}</div>
          `;
          box.appendChild(item);
        });
      } catch (e) {
        box.innerHTML = "<p class='small'>내 요청을 불러오지 못했습니다: " + escapeHtml(e.message) + "</p>";
      }
    }

    $("submitBtn").addEventListener("click", async () => {
      if (!currentUser || !currentProfile) {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
        return;
      }

      if (currentProfile.blocked === true) {
        alert("차단된 계정은 요청을 등록할 수 없습니다.");
        return;
      }

      const category = $("category").value;
      const title = $("title").value.trim();
      const content = $("content").value.trim();

      if (!title || !content) {
        alert("제목과 내용을 입력해주세요.");
        return;
      }

      try {
        $("submitBtn").disabled = true;
        $("submitBtn").textContent = "등록 중...";

        await addDoc(collection(db, "requests"), {
          anonymous: true,
          uid: currentUser.uid,
          category,
          title,
          content,
          status: "접수",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          source: "login-anonymous-request-page"
        });

        $("title").value = "";
        $("content").value = "";
        alert("익명 요청이 등록되었습니다.");
        await loadMyRequests();
      } catch (e) {
        alert("요청 등록 실패: " + e.message);
      } finally {
        $("submitBtn").disabled = false;
        $("submitBtn").textContent = "익명 요청 등록";
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.reload();
    });

    onAuthStateChanged(auth, async user => {
      currentUser = user;

      if (!user) {
        currentProfile = null;
        $("userInfo").innerHTML = "로그인이 필요합니다. <a href='login.html'>로그인 / 회원가입</a>";
        $("requestFormCard").style.display = "none";
        $("logoutBtn").style.display = "none";
        $("loginTopLink").style.display = "inline-flex";
        await loadMyRequests();
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        currentProfile = snap.exists() ? snap.data() : {};
        $("logoutBtn").style.display = "inline-flex";
        $("loginTopLink").style.display = "none";

        if (currentProfile.blocked === true) {
          $("userInfo").textContent = "로그인됨 / 차단된 계정입니다. 요청을 작성할 수 없습니다.";
          $("requestFormCard").style.display = "none";
        } else {
          $("userInfo").textContent = "로그인됨 / 익명 요청 작성 가능";
          $("requestFormCard").style.display = "block";
        }

        await loadMyRequests();
      } catch (e) {
        $("userInfo").textContent = "사용자 정보를 불러오지 못했습니다: " + e.message;
        $("requestFormCard").style.display = "none";
      }
    });
  </script>
</body>
</html>
