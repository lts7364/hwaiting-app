<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 다운로드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page narrow">
    <section class="hero small-hero">
      <div class="badge">APK 다운로드</div>
      <h1>다운로드</h1>
      <p class="subtitle">로그인 후 APK를 다운로드할 수 있습니다.</p>
    </section>

    <section class="card notice-card">
      <h2>다운로드 전 안내</h2>
      <p>
        이 앱은 개인 편의를 위한 비공식 앱이며, 회사 또는 특정 기관의 공식 앱이 아닙니다.
        근무 정보는 참고용이므로 실제 근무표와 공식 공지를 우선 확인해 주세요.
      </p>
      <p>
        
        무단 재배포는 권장하지 않습니다.
      </p>
    </section>

    <section class="card">
      <h2>사용자 정보</h2>
      <p id="userInfo" class="small">확인 중...</p>
      <p id="downloadStatus" class="small"></p>
      <div class="actions left">
        <button class="btn primary" id="downloadBtn" style="display:none;">APK 다운로드</button>
        <a class="btn secondary" id="loginLink" href="login.html" style="display:none;">로그인</a>
        <button class="btn secondary" id="logoutBtn" style="display:none;">로그아웃</button>
        <a class="btn secondary" href="request.html">가입자 익명 요청함</a>
      </div>
    </section>
<section class="card warn">
      <h2>안내</h2>
      <p>APK 설치 시 알 수 없는 앱 설치 허용이 필요할 수 있습니다.</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, ADMIN_EMAIL, APP_VERSION, APK_FILE } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    let currentUser = null;
    let currentProfile = null;

    async function ensureProfile(user) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()) return snap.data();

      const role = user.email === ADMIN_EMAIL ? "admin" : "user";
      const data = {
        uid: user.uid,
        email: user.email,
        name: user.displayName || user.email.split("@")[0],
        department: "",
        approved: true,
        blocked: false,
        role,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
      await setDoc(ref, data, { merge: true });
      return data;
    }

    onAuthStateChanged(auth, async user => {
      currentUser = user;
      if (!user) {
        $("userInfo").textContent = "로그인이 필요합니다.";
        $("loginLink").style.display = "inline-flex";
        $("downloadBtn").style.display = "none";
        $("logoutBtn").style.display = "none";
        return;
      }

      try {
        currentProfile = await ensureProfile(user);
        $("logoutBtn").style.display = "inline-flex";
        $("loginLink").style.display = "none";

        const name = currentProfile.name || user.email;
        const dept = currentProfile.department || "-";
        $("userInfo").textContent = `${name} / ${dept} / ${user.email}`;

        if (currentProfile.blocked === true) {
          $("downloadStatus").textContent = "이 계정은 다운로드가 차단되었습니다. 관리자에게 문의하세요.";
          $("downloadBtn").style.display = "none";
        } else {
          $("downloadStatus").textContent = "다운로드 가능합니다.";
          $("downloadBtn").style.display = "inline-flex";
        }
      } catch (e) {
        $("userInfo").textContent = "사용자 정보를 불러오지 못했습니다.";
        $("downloadStatus").textContent = e.message;
      }
    });

    $("downloadBtn").addEventListener("click", async () => {
      if (!currentUser || !currentProfile) {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
        return;
      }
      if (currentProfile.blocked === true) {
        alert("다운로드가 차단된 계정입니다.");
        return;
      }

      try {
        $("downloadStatus").textContent = "다운로드 준비 중...";
        await addDoc(collection(db, "downloadLogs"), {
          uid: currentUser.uid,
          email: currentUser.email,
          name: currentProfile.name || "",
          department: currentProfile.department || "",
          versionName: APP_VERSION.versionName,
          versionCode: APP_VERSION.versionCode,
          apkFile: APK_FILE,
          status: "success",
          downloadedAt: serverTimestamp(),
          userAgent: navigator.userAgent
        });

        $("downloadStatus").textContent = "APK 다운로드를 시작합니다.";
        window.location.href = APK_FILE;
      } catch (e) {
        alert("다운로드 실패: " + e.message);
        $("downloadStatus").textContent = "다운로드 실패";
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "login.html";
    });
  </script>
</body>
</html>
