<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>화이팅 로그인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page narrow">
    <section class="hero small-hero">
      <div class="badge">화이팅 이용하기</div>
      <h1>로그인</h1>
      <p class="subtitle">이미 가입했다면 로그인, 처음이라면 회원가입을 선택해 주세요.</p>
    </section>

    <section class="card" id="modeCard">
      <h2>시작하기</h2>
      <div class="mode-grid">
        <button class="mode-card" id="showLogin" type="button">
          <b>로그인</b>
          <span>이미 가입한 경우</span>
        </button>
        <button class="mode-card" id="showSignup" type="button">
          <b>처음 이용해요</b>
          <span>처음 사용하는 경우</span>
        </button>
      </div>
    </section>

    <section class="card hidden" id="loginCard">
      <h2>로그인</h2>
      <div class="form">
        <input id="loginEmail" type="email" placeholder="이메일" autocomplete="email" />
        <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" />
        <button class="btn primary full" id="loginBtn">로그인</button>
      </div>
      <div class="text-links">
        <button id="toSignup" type="button">처음 이용해요</button>
        <a href="index.html">홈으로</a>
      </div>
    </section>

    <section class="card hidden" id="signupCard">
      <h2>회원가입</h2>
      <div class="form">
        <input id="signupName" placeholder="이름" autocomplete="name" />
        <input id="signupDepartment" placeholder="부서" autocomplete="organization" />
        <input id="signupEmail" type="email" placeholder="이메일" autocomplete="email" />
        <input id="signupPassword" type="password" placeholder="비밀번호" autocomplete="new-password" />
        <input id="signupPassword2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" />
        <button class="btn primary full" id="signupBtn">회원가입</button>
      </div>
      <div class="text-links">
        <button id="toLogin" type="button">이미 가입했어요</button>
        <a href="index.html">홈으로</a>
      </div>
    </section>

    <section class="card done-card hidden" id="loggedInCard">
      <h2>로그인 완료</h2>
      <p id="status" class="small">확인 중...</p>
      <div class="actions">
        <a class="btn primary" href="download.html">다운로드로 이동</a>
        <a class="btn secondary" href="request.html">요청함</a>
        <button class="btn danger" id="logoutBtn">로그아웃</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signOut, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, getDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    function showMode(mode) {
      $("modeCard").classList.add("hidden");
      $("loginCard").classList.toggle("hidden", mode !== "login");
      $("signupCard").classList.toggle("hidden", mode !== "signup");
      $("loggedInCard").classList.add("hidden");
    }

    $("showLogin").addEventListener("click", () => showMode("login"));
    $("showSignup").addEventListener("click", () => showMode("signup"));
    $("toSignup").addEventListener("click", () => showMode("signup"));
    $("toLogin").addEventListener("click", () => showMode("login"));

    async function createUserProfile(user, name, department) {
      const role = user.email === ADMIN_EMAIL ? "admin" : "user";
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        email: user.email,
        name: name || "",
        department: department || "",
        approved: true,
        blocked: false,
        role,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    $("signupBtn").addEventListener("click", async () => {
      const name = $("signupName").value.trim();
      const department = $("signupDepartment").value.trim();
      const email = $("signupEmail").value.trim();
      const password = $("signupPassword").value;
      const password2 = $("signupPassword2").value;

      if (!name || !department || !email || !password) {
        alert("이름, 부서, 이메일, 비밀번호를 모두 입력해주세요.");
        return;
      }
      if (password !== password2) {
        alert("비밀번호 확인이 다릅니다.");
        return;
      }

      try {
        $("signupBtn").disabled = true;
        $("signupBtn").textContent = "가입 중...";
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        await createUserProfile(cred.user, name, department);
        location.href = "download.html";
      } catch (e) {
        alert("회원가입 실패: " + e.message);
      } finally {
        $("signupBtn").disabled = false;
        $("signupBtn").textContent = "회원가입";
      }
    });

    $("loginBtn").addEventListener("click", async () => {
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      if (!email || !password) {
        alert("이메일과 비밀번호를 입력해주세요.");
        return;
      }
      try {
        $("loginBtn").disabled = true;
        $("loginBtn").textContent = "로그인 중...";
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const snap = await getDoc(doc(db, "users", cred.user.uid));
        if (!snap.exists()) {
          const name = cred.user.displayName || email.split("@")[0];
          await createUserProfile(cred.user, name, "");
        }
        location.href = "download.html";
      } catch (e) {
        alert("로그인 실패: " + e.message);
      } finally {
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = "로그인";
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.reload();
    });

    onAuthStateChanged(auth, async user => {
      if (!user) return;
      $("modeCard").classList.add("hidden");
      $("loginCard").classList.add("hidden");
      $("signupCard").classList.add("hidden");
      $("loggedInCard").classList.remove("hidden");

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() : {};
        $("status").textContent = `${data.name || user.email}님, 로그인되어 있습니다.`;
      } catch (e) {
        $("status").textContent = `${user.email} 로그인됨`;
      }
    });
  </script>
</body>
</html>
