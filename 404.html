<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화이팅</title><meta http-equiv="refresh" content="0; url=./index.html"><style>
:root{--bg:#f6f9ff;--card:#fff;--text:#1f2b3d;--muted:#6d7a8a;--line:#dce6f2;--primary:#2f7fe8;--primary2:#1f65c1;--danger:#d64545;--ok:#177a47;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;background:linear-gradient(180deg,#eef6ff,#fff);color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 44px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 10px 30px rgba(31,65,110,.08)}
h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.55}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e9f3ff;color:var(--primary2);font-weight:800;font-size:13px;margin-bottom:10px}
.btn{width:100%;display:block;text-align:center;text-decoration:none;border:none;border-radius:16px;padding:15px 16px;font-weight:900;font-size:16px;margin:10px 0;cursor:pointer}.primary{background:var(--primary);color:white}.primary:active{background:var(--primary2)}.ghost{background:#fff;color:var(--primary2);border:1px solid #bcd5f5}.danger{background:#fff3f3;color:var(--danger);border:1px solid #ffc8c8}.ok{color:var(--ok);font-weight:800}.hide{display:none!important}
input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;margin:7px 0;font-size:15px;background:#fff}label{font-size:13px;font-weight:800;color:#44546a}.row{display:flex;gap:10px}.row>*{flex:1}.small{font-size:12px}.log{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px;color:#516070;font-size:13px;line-height:1.5}.list{padding-left:18px;line-height:1.7}.center{text-align:center}.footer{padding:20px 4px;text-align:center;color:#8a96a8;font-size:12px}
</style></head><body><main class="wrap"><section class="card center"><h1>페이지 이동 중</h1><p class="muted">화이팅 홈으로 이동합니다.</p><a class="btn primary" href="./index.html">홈으로 이동</a></section></main></body></html>
